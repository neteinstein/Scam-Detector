<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="extName">Scam Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="verdict" id="verdict">
      <div class="badge" id="badge">–</div>
      <div>
        <div class="title" id="title" data-i18n="popup_analysing">Analysing…</div>
        <div class="host" id="host"></div>
      </div>
    </div>
  </header>
  <main>
    <div class="access hidden" id="access">
      <p data-i18n="popup_no_access">Scam Detector does not have access to websites yet, so no page is being checked.</p>
      <button id="grant" class="btn primary" data-i18n="btn_grant_access">Allow access to websites</button>
    </div>
    <div class="chat hidden" id="chat"></div>
    <p class="summary" id="summary"></p>
    <ul class="signals" id="signals"></ul>
    <dl class="meta" id="meta"></dl>
  </main>
  <footer>
    <button id="rescan" class="btn" data-i18n="btn_rescan">Re-scan</button>
    <button id="trust" class="btn" data-i18n="btn_trust">Trust this site</button>
    <button id="untrust" class="btn hidden" data-i18n="btn_untrust">Stop trusting</button>
    <a id="options" class="btn link" href="#" data-i18n="btn_settings">Settings</a>
  </footer>
  <script src="../src/lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
