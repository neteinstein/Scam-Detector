# Builds the Chrome and Firefox packages for every version and publishes it as a
# GitHub Release. Runs on every push to main (or manually); the release is
# created only if a tag for the manifest version does not exist yet, so a
# push that does not bump the version is a cheap no-op.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Tests and checks
        if: steps.v.outputs.exists == 'false'
        run: npm test

      - name: Build package
        if: steps.v.outputs.exists == 'false'
        run: |
          npm run package
          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Validate the Firefox package (addons-linter)
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p dist/firefox && cd dist/firefox && unzip -q ../scam-detector-${{ steps.v.outputs.version }}-firefox.zip
          npx --yes web-ext@8 lint --source-dir .

      - name: Release notes from store-listing/listing.md
        if: steps.v.outputs.exists == 'false'
        run: |
          node tools/release-notes.js > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Tag and publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          git tag "v$V" && git push origin "v$V"
          gh release create "v$V" dist/scam-detector-$V-chrome.zip dist/scam-detector-$V-firefox.zip dist/SHA256SUMS.txt --title "Scam Detector $V" --notes-file dist/RELEASE_NOTES.md

      - name: Already released
        if: steps.v.outputs.exists == 'true'
        run: echo "Tag v${{ steps.v.outputs.version }} already exists; bump manifest.json version to publish a new build."
