name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Unit tests, listing & catalogue checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests + store-listing consistency + catalogue report
        run: npm test
      - name: Build the installable package (sanity)
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: scam-detector-unpacked-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14

  e2e:
    name: Extension in Chromium (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npm install && npx playwright install --with-deps chromium
      - name: Run end-to-end scenarios
        run: npm run e2e -- e2e-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-output/
          retention-days: 7
