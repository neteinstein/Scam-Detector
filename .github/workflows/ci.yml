name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Unit tests, listing & catalogue checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests + store-listing consistency + catalogue report
        run: npm test
      - name: Build the Chrome and Firefox packages (sanity)
        run: npm run package
      - name: Lint the Firefox package (addons-linter)
        run: |
          V=$(node -p "require('./manifest.json').version")
          mkdir -p dist/firefox && cd dist/firefox && unzip -q ../scam-detector-$V-firefox.zip
          npx --yes web-ext@8 lint --source-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: scam-detector-unpacked-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14

  false-alarms:
    # The 10,000 most visited sites must not warn on their address alone. The Tranco
    # list is downloaded here rather than committed: it carries no redistribution license.
    name: No false alarms on top sites (Tranco top 10k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the current Tranco list
        id: tranco
        run: |
          if curl -fsSL --retry 3 --retry-delay 5 -o top.zip https://tranco-list.eu/top-1m.csv.zip && unzip -q -o top.zip; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tranco list could not be downloaded; false-alarm sweep skipped"
          fi
      - name: Sweep the top 10,000 sites
        if: steps.tranco.outputs.ok == 'true'
        run: npm run sweep -- --list top-1m.csv --top 10000 --check

  e2e:
    name: Extension in Chromium (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npm install && npx playwright install --with-deps chromium
      - name: Run end-to-end scenarios
        run: npm run e2e -- e2e-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-output/
          retention-days: 7
